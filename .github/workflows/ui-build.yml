name: UI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/ui/**"
      - "package.json"
      - "bun.lock"
      - "crates/shared/generated/ts/**"
      - ".github/workflows/ui-build.yml"
  push:
    branches: [main]
    paths:
      - "packages/ui/**"
      - "package.json"
      - "bun.lock"
      - "crates/shared/generated/ts/**"
      - ".github/workflows/ui-build.yml"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ui

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check types and formatting
        run: bun run lint-check

      - name: Run behavioral regressions
        run: bun test

      - name: Build project
        run: bun run build

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: nocturne-ui
          path: packages/ui/dist
